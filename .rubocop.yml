AllCops:
  DisplayCopNames: true
  DisplayStyleGuide: true
  EnabledByDefault: true
  Exclude:
    - bin/**/*
    - vendor/**/*
  ExtraDetails: true
  NewCops: enable
  TargetRubyVersion: 3.2
  UseCache: true

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

inherit_gem:
  docquet:
    - config/cops/bundler.yml
    - config/cops/gemspec.yml
    - config/cops/layout.yml
    - config/cops/lint.yml
    - config/cops/metrics.yml
    - config/cops/naming.yml
    - config/cops/performance.yml
    - config/cops/rake.yml
    - config/cops/rspec.yml
    - config/cops/security.yml
    - config/cops/style.yml

inherit_from: .rubocop_todo.yml

# Project-specific settings can be added here

# get_pages, get_page, put_page follow REST API naming convention
Naming/AccessorMethodName:
  Exclude:
    - 'lib/wikiwiki/api.rb'

# request method centralizes HTTP request logic
# attachment method includes validation logic (size and MD5 checks)
# CLI command methods handle multiple concerns (validation, progress, output)
Metrics/AbcSize:
  Exclude:
    - 'lib/wikiwiki/api.rb'
    - 'lib/wikiwiki/wiki.rb'
    - 'lib/wikiwiki/cli/commands/**/*'

# attachment method includes validation logic (size and MD5 checks)
# request method centralizes HTTP request logic with rate limiting
# CLI command methods include option parsing, progress bar handling, and output formatting
# create_wiki method handles environment variable fallback and validation
Metrics/MethodLength:
  Exclude:
    - 'lib/wikiwiki/api.rb'
    - 'lib/wikiwiki/wiki.rb'
    - 'lib/wikiwiki/cli/commands/**/*'

# CLI command methods have conditional logic for options and output modes
# create_wiki method handles environment variable fallback logic
Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/wikiwiki/cli/commands/**/*'

# create_wiki method handles environment variable fallback and validation
Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/wikiwiki/cli/commands/base.rb'

# API class centralizes HTTP communication, authentication, and logging
Metrics/ClassLength:
  Exclude:
    - 'lib/wikiwiki/api.rb'

# Page, Attachment, Password, and ApiKey classes are reopened for YARD documentation purposes
Lint/EmptyClass:
  Exclude:
    - 'lib/wikiwiki/page.rb'
    - 'lib/wikiwiki/attachment.rb'
    - 'lib/wikiwiki/auth/password.rb'
    - 'lib/wikiwiki/auth/api_key.rb'

# Commands module is documented in base.rb and reopened in other files
Style/Documentation:
  Exclude:
    - 'lib/wikiwiki/cli/commands/**/*'

RSpec/ExampleLength:
  Max: 15

Layout/LineLength:
  Enabled: false
